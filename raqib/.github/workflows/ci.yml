name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build
      - name: smoke
        shell: bash
        run: |
          node dist/raqib.mjs version
          node dist/raqib.mjs doctor
          node dist/raqib.mjs index . --json > /dev/null
          node dist/raqib.mjs search src "evidence" --json > /dev/null
