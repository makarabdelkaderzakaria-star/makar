name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  # The Windows backend is cfg(windows) code developed on Linux. Type-check it
  # from a Linux runner so it can never silently rot again -- the first draft of
  # crates/nr-divert/src/win.rs did not even compile.
  windows-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: clippy (windows target, all targets)
        run: bash scripts/ci-annotate.sh "clippy/windows" cargo clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: check (windows target)
        run: bash scripts/ci-annotate.sh "check/windows" cargo check --target x86_64-pc-windows-msvc --all-targets

  # Temporary convenience job: apply rustfmt and push the result, so a layout
  # disagreement never needs a manual round trip. It only pushes when
  # formatting actually changed, so it cannot loop. Removed once clean.
  format:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all
      - name: commit and push if changed
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "netrocket-fmt"
          git config user.email "noreply@localhost"
          git commit -qam "style: cargo fmt"
          git push

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: bash scripts/ci-annotate.sh fmt cargo fmt --all -- --check
      - name: clippy
        run: bash scripts/ci-annotate.sh clippy cargo clippy --all-targets -- -D warnings
      - name: test
        run: bash scripts/ci-annotate.sh test cargo test --all
      - name: build release
        run: bash scripts/ci-annotate.sh build cargo build --release
      - name: smoke
        shell: bash
        run: |
          ./target/release/netrocket version
          ./target/release/netrocket init
          ./target/release/netrocket check
          ./target/release/netrocket lint
          ./target/release/netrocket simulate --frames=500
