name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The Windows backend is cfg(windows) code developed on Linux. Type-check it
  # from a Linux runner so it can never silently rot again -- the first draft of
  # crates/nr-divert/src/win.rs did not even compile.
  windows-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: clippy (windows target, all targets)
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: check (windows target)
        run: cargo check --target x86_64-pc-windows-msvc --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        shell: bash
        run: |
          set +e
          cargo test --all 2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The job log is large and only reachable from a browser; mirror the
            # useful lines into check-run annotations, which the REST API serves.
            grep -nE "^(error(\[[A-Z0-9]+\])?:|test .* FAILED|failures:|---- .* stdout ----|thread .* panicked)" \
              "$RUNNER_TEMP/test.log" | head -25 | while IFS= read -r line; do
              echo "::error title=cargo test::$line"
            done
          fi
          exit "$status"
      - name: build release
        run: cargo build --release
      - name: smoke
        run: |
          ./target/release/netrocket version
          ./target/release/netrocket init
          ./target/release/netrocket check
          ./target/release/netrocket simulate --frames=500
        shell: bash
