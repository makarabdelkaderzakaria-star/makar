name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  # The Windows backend is cfg(windows) code developed on Linux. Type-check it
  # from a Linux runner so it can never silently rot again -- the first draft of
  # crates/nr-divert/src/win.rs did not even compile.
  windows-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: clippy (windows target, all targets)
        run: ./scripts/ci-annotate.sh "clippy/windows" cargo clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - name: check (windows target)
        run: ./scripts/ci-annotate.sh "check/windows" cargo check --target x86_64-pc-windows-msvc --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: ./scripts/ci-annotate.sh fmt cargo fmt --all -- --check
      - name: clippy
        run: ./scripts/ci-annotate.sh clippy cargo clippy --all-targets -- -D warnings
      - name: test
        run: ./scripts/ci-annotate.sh test cargo test --all
      - name: build release
        run: ./scripts/ci-annotate.sh build cargo build --release
      - name: smoke
        shell: bash
        run: |
          ./target/release/netrocket version
          ./target/release/netrocket init
          ./target/release/netrocket check
          ./target/release/netrocket lint
          ./target/release/netrocket simulate --frames=500
